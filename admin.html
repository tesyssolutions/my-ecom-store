<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Add Products</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Admin Dashboard</h1>
    <nav>
      <a href="index.html">View Storefront</a>
      <a href="admin.html">Admin Panel</a>
    </nav>
  </header>

  <div class="container">
    <div class="admin-card">
      <h2>Add New Product</h2>
      <br>
      <form id="productForm">
        <div class="form-group">
          <label for="productName">Product Title</label>
          <input type="text" id="productName" placeholder="e.g., Wireless Headphones" required>
        </div>
        <div class="form-group">
          <label for="productPrice">Price (₹)</label>
          <input type="number" id="productPrice" placeholder="e.g., 2999" required>
        </div>
        <div class="form-group">
          <label for="productImage">Image URL</label>
          <input type="url" id="productImage" placeholder="e.g., https://images.unsplash.com/photo-..." required>
        </div>
        <div class="form-group">
          <label for="productDesc">Description</label>
          <textarea id="productDesc" rows="3" placeholder="Brief product summary..."></textarea>
        </div>
		<div class="form-group">
        <label for="productRating">Rating (1 to 5)</label>
        <input type="number" id="productRating" min="1" max="5" step="0.1" placeholder="e.g., 4.5">
        </div>
		<div class="form-group">
        <label for="productNumb">Rating (1 to 5)</label>
        <input type="number" id="productNumb" min="1" max="5" step="0.1" placeholder="e.g., 4.5">
        </div>
        <button type="submit" class="btn">Add Product to Store</button>
      </form>
    </div>

    <h2>Current Products</h2>
    <br>
    <div id="adminProductGrid" class="product-grid">
      <!-- Managed products loaded here -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
